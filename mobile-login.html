<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WMS+ mobile — Вход</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.field {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 14px;
  box-sizing: border-box;
  background: #ffffff;
  color: #101010;
}
.field:focus {
  outline: none;
  border-color: var(--accent, #0f5f7a);
  box-shadow: 0 0 0 3px rgba(15, 95, 122, 0.12);
}
/* Kiosk/mobile page, nothing to scroll with -- never let the page itself
   scroll (mirrors display.html's same rule). */
html, body { height: 100%; overflow: hidden; margin: 0; }
</style>
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100dvh;padding:16px;box-sizing:border-box;">
<div class="card" style="padding:28px;width:100%;max-width:360px;max-height:100%;overflow-y:auto;box-sizing:border-box;">
    <h1>WMS+ mobile</h1>
    <label style="display:block;font-size:13px;font-weight:600;margin:0 0 6px;">Табельный номер</label>
    <input id="idInput" class="field" type="text" inputmode="numeric" placeholder="ID" style="margin-bottom:12px;">
    <label style="display:block;font-size:13px;font-weight:600;margin:0 0 6px;">Пароль</label>
    <input id="passInput" class="field" type="password" placeholder="Пароль" style="margin-bottom:16px;">
    <button id="loginBtn" class="btn btn-rect" type="button" style="width:100%;">Войти</button>
    <div id="loginMsg" style="margin-top:12px;font-size:13px;font-weight:600;text-align:center;min-height:18px;"></div>
</div>
<script src="mobile-login.js"></script>
</body>
</html>
