<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WMS+ mobile — Инвентаризация</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<!-- Needed by print-tspl.js's qr-as-bitmap rendering (qrModuleMatrixFor)
     for the missing-sticker reprint flow -- same library/version as
     display.html's pairing QR. -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
/* Kiosk/mobile page, nothing to scroll with -- never let the page itself
   scroll (mirrors display.html's same rule). Individual sub-elements
   (e.g. the missing-sticker box picker's own list) may still scroll
   internally within their own fixed max-height. */
html, body { height: 100%; overflow: hidden; margin: 0; }
.field {
  display: block;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  font-size: 14px;
  box-sizing: border-box;
  background: #ffffff;
  color: #101010;
}
.field:focus {
  outline: none;
  border-color: var(--accent, #0f5f7a);
  box-shadow: 0 0 0 3px rgba(15, 95, 122, 0.12);
}
@keyframes box-scan-success {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
    70% { box-shadow: 0 0 0 22px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}
.card.is-scan-success { animation: box-scan-success .6s ease-out; }
/* Square viewfinder: video fills the square (cropped via object-fit, not
   stretched) with a centered aim-frame reticle on top so the worker knows
   where to point the camera, and everything outside the reticle dimmed
   for the same reason phone camera apps do this -- it reads as "aim
   here" at a glance, no label needed. */
#scanFrame {
    display: none;
    position: relative;
    width: 100%;
    max-width: 260px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: #000;
}
#invVideo {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translate(-50%, -50%);
}
#scanReticle {
    position: absolute;
    inset: 14%;
    border: 3px solid rgba(255, 255, 255, .9);
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .32);
    pointer-events: none;
}
</style>
</head>
<body style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;margin:0;padding:20px;box-sizing:border-box;">
<div class="card" style="padding:24px;width:100%;max-width:420px;max-height:100%;overflow-y:auto;box-sizing:border-box;text-align:center;">
    <h1 id="stepTitle">Инвентаризация «Без ШК»</h1>
    <p id="stepMsg" style="margin:0 0 16px;font-size:14px;color:#64748b;"></p>
    <div id="scanFrame">
        <video id="invVideo" playsinline muted></video>
        <div id="scanReticle"></div>
    </div>
    <canvas id="invCanvas" style="display:none;"></canvas>
    <div id="stepButtons" style="display:flex;flex-direction:column;gap:10px;margin-top:16px;"></div>
</div>
<!-- Cache-busting query string -- GitHub Pages serves these with
     cache-control: max-age=600, so a phone that loaded this page within
     the last 10 minutes can otherwise keep running old JS after a normal
     reload. Bump the number whenever mobile-inventory.js/print-tspl.js/
     inventory-dates.js change so testers reliably get the new code. -->
<script src="print-tspl.js?v=8"></script>
<script src="inventory-dates.js?v=8"></script>
<script src="mobile-inventory.js?v=8"></script>
</body>
</html>
