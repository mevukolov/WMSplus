<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Генератор A4 табличек QR</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js" defer></script>
  <style>
    :root {
      --ink: #111;
      --muted: #62666f;
      --line: #111;
      --panel: #f4f6f8;
      --control: #fff;
      --accent: #0f5f7a;
      --danger: #b42318;
      --a4-w: 210mm;
      --a4-h: 297mm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #dfe4e8;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 430px) 1fr;
      gap: 18px;
      min-height: 100vh;
      padding: 18px;
    }

    .controls {
      position: sticky;
      top: 18px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 36px);
      padding: 16px;
      overflow: auto;
      background: var(--panel);
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    .controls h1 {
      margin: 0 0 2px;
      font-size: 20px;
      line-height: 1.15;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label,
    .field-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #374151;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-height: 38px;
      padding: 9px 10px;
      border: 1px solid rgba(15, 23, 42, 0.18);
      border-radius: 6px;
      background: var(--control);
      color: var(--ink);
      outline: none;
    }

    .field textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.35;
      white-space: pre;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 95, 122, 0.12);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .check-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: start;
      color: #1f2937;
      font-size: 13px;
      line-height: 1.35;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      margin: 1px 0 0;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      min-height: 38px;
      padding: 9px 13px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-secondary {
      background: #fff;
      border-color: rgba(15, 23, 42, 0.18);
      color: #111827;
    }

    .status {
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }

    .preview {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-width: 0;
      overflow: auto;
      padding: 10px 0 28px;
    }

    .sheet {
      position: relative;
      width: var(--a4-w);
      min-width: var(--a4-w);
      height: var(--a4-h);
      padding: 4mm 5mm;
      background: #fff;
      box-shadow: 0 18px 70px rgba(15, 23, 42, 0.28);
      overflow: hidden;
    }

    .sheet-frame {
      display: grid;
      grid-template-rows: 12.5mm 1fr 14mm;
      width: 100%;
      height: 100%;
      padding: 4.8mm 5.6mm 4.2mm;
      border: 0.95mm solid var(--line);
      border-radius: 3mm;
    }

    .sheet-title {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
      font-size: 6.4mm;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(var(--group-count), minmax(0, 1fr));
      gap: 4.4mm;
      min-height: 0;
    }

    .group {
      position: relative;
      display: grid;
      grid-template-rows: 1fr;
      isolation: isolate;
      min-width: 0;
      min-height: 0;
      padding-top: 1.45mm;
    }

    .group-title {
      position: absolute;
      top: 0.2mm;
      left: 3mm;
      z-index: 3;
      display: inline-flex;
      width: max-content;
      max-width: calc(100% - 5mm);
      margin: 0;
      padding: 0 1.15mm 0.25mm;
      background: #fff;
      box-shadow: 0 0 0 0.55mm #fff;
      font-size: 3.2mm;
      font-style: italic;
      line-height: 1;
      white-space: nowrap;
    }

    .group-box {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(var(--cols-per-group), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows-per-group), minmax(0, 1fr));
      align-items: stretch;
      gap: 0.65mm 1.1mm;
      min-height: 0;
      padding: 2.75mm 0.75mm 0.75mm;
      border: 0.32mm solid var(--line);
      border-radius: 1.7mm;
    }

    .label-card {
      display: grid;
      grid-template-columns: 7.2mm minmax(7.8mm, 1fr) 7.2mm;
      align-items: center;
      gap: 0.65mm;
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: 0.5mm 0.65mm;
      border: 0.48mm solid var(--line);
      border-radius: 1.2mm;
      overflow: hidden;
      page-break-inside: avoid;
    }

    .label-card.empty {
      visibility: hidden;
    }

    .qr-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 7.2mm;
      height: 7.2mm;
      overflow: hidden;
    }

    .qr-slot canvas {
      width: 7.2mm !important;
      height: 7.2mm !important;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }

    .label-text {
      min-width: 0;
      text-align: center;
      font-size: 4.15mm;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 7mm;
      min-width: 0;
    }

    .footer-left,
    .footer-right {
      min-width: 0;
      white-space: pre-line;
      line-height: 0.92;
      font-weight: 900;
      color: var(--ink);
    }

    .footer-left {
      display: grid;
      grid-template-columns: 12.5mm minmax(0, 1fr);
      gap: 2.2mm;
      align-items: end;
      max-width: 78mm;
      font-size: 3.35mm;
    }

    .footer-right {
      text-align: right;
      font-size: 5.2mm;
      letter-spacing: -0.03em;
    }

    .footer-logo {
      display: block;
      width: 12.5mm;
      height: 12.5mm;
      object-fit: contain;
    }

    .footer-left.no-mark {
      grid-template-columns: 1fr;
    }

    .footer-left.no-mark .footer-logo {
      display: none;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
        max-height: none;
      }

      .preview {
        justify-content: flex-start;
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      :root {
        --print-scale: 0.94;
        --print-x: 6mm;
        --print-y: 18mm;
      }

      html,
      body {
        width: var(--a4-w);
        height: var(--a4-h);
        min-width: 0;
        min-height: 0;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #fff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .controls {
        display: none !important;
      }

      .app {
        display: block !important;
        width: var(--a4-w);
        height: var(--a4-h);
        min-height: 0;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
      }

      .preview {
        display: block !important;
        width: var(--a4-w);
        height: var(--a4-h);
        min-height: 0;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
      }

      .sheet {
        position: relative;
        width: var(--a4-w);
        height: var(--a4-h);
        min-width: var(--a4-w);
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        overflow: hidden !important;
        break-inside: avoid;
        break-after: avoid;
        page-break-inside: avoid;
        page-break-after: avoid;
      }

      .sheet-frame {
        width: var(--a4-w);
        height: var(--a4-h);
        grid-template-rows: 12mm 1fr 13mm;
        padding: 4.4mm 5.2mm 3.8mm;
        border-width: 0.8mm;
        border-radius: 2.6mm;
        transform: translate(var(--print-x), var(--print-y)) scale(var(--print-scale));
        transform-origin: top left;
      }

      .sheet-title {
        font-size: 5.8mm;
      }

      .groups {
        gap: 3.2mm;
      }

      .footer {
        gap: 5mm;
      }

      .footer-left {
        grid-template-columns: 10.5mm minmax(0, 1fr);
        gap: 1.6mm;
        font-size: 2.9mm;
      }

      .footer-logo {
        width: 10.5mm;
        height: 10.5mm;
      }

      .footer-right {
        font-size: 4.5mm;
      }

      .sheet-frame,
      .groups,
      .group,
      .group-box {
        max-height: 100%;
        overflow: hidden !important;
      }

      .label-text {
        overflow: hidden !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="controls" aria-label="Настройки таблички">
      <div>
        <h1>Таблички A4 с QR</h1>
        <p class="hint">Список можно вставлять строками. Форматы: <b>01 | QR</b>, <b>01;QR</b>, <b>01↹QR</b> или просто <b>QR</b>.</p>

  <script>
    const elements = {
      title: document.getElementById("titleInput"),
      groupsInput: document.getElementById("groupsInput"),
      columns: document.getElementById("columnsInput"),
      rows: document.getElementById("rowsInput"),
      start: document.getElementById("startInput"),
      pad: document.getElementById("padInput"),
      resetNumbering: document.getElementById("resetNumberingInput"),
      mirrorQr: document.getElementById("mirrorQrInput"),
      fillEmpty: document.getElementById("fillEmptyInput"),
      items: document.getElementById("itemsInput"),
      footerLeftInput: document.getElementById("footerLeftInput"),
      footerRightInput: document.getElementById("footerRightInput"),
      mark: document.getElementById("markInput"),
      renderBtn: document.getElementById("renderBtn"),
      printBtn: document.getElementById("printBtn"),
      sampleBtn: document.getElementById("sampleBtn"),
      status: document.getElementById("status"),
      sheetTitle: document.getElementById("sheetTitle"),
      groups: document.getElementById("groups"),
      footerLeft: document.getElementById("footerLeft"),
      footerLeftText: document.getElementById("footerLeftText"),
      footerRight: document.getElementById("footerRight"),
    };

    const sampleRows = elements.items.value;

    function clampNumber(value, min, max, fallback) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return fallback;
      return Math.min(max, Math.max(min, Math.round(parsed)));
    }

    function splitLines(value) {
      return String(value || "")
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function splitItemLine(line) {
      const separators = ["|", ";", "\t", ","];
      for (const separator of separators) {
        if (line.includes(separator)) {
          const parts = line.split(separator).map((part) => part.trim());
          if (parts.length >= 2 && parts[1]) {
            return { label: parts[0] || "", value: parts.slice(1).join(separator).trim() };
          }
        }
      }
      return { label: "", value: line.trim() };
    }

    function labelFor(index, groupIndex, perGroup, settings) {
      const localIndex = settings.resetNumbering ? index - groupIndex * perGroup : index;
      const value = settings.start + localIndex;
      return String(value).padStart(settings.pad, "0");
    }

    function readSettings() {
      const groupTitles = splitLines(elements.groupsInput.value);
      const columns = clampNumber(elements.columns.value, 1, 4, 2);
      const rows = clampNumber(elements.rows.value, 4, 30, 20);
      return {
        title: elements.title.value.trim() || "Таблички",
        groupTitles: groupTitles.length ? groupTitles : ["Ряд 1"],
        columns,
        rows,
        perGroup: columns * rows,
        start: clampNumber(elements.start.value, 0, 999999, 1),
        pad: clampNumber(elements.pad.value, 1, 6, 2),
        resetNumbering: elements.resetNumbering.checked,
        mirrorQr: elements.mirrorQr.checked,
        fillEmpty: elements.fillEmpty.checked,
      };
    }

    function parseItems(settings) {
      return splitLines(elements.items.value).map((line, index) => {
        const groupIndex = Math.floor(index / settings.perGroup);
        const parsed = splitItemLine(line);
        return {
          label: parsed.label || labelFor(index, groupIndex, settings.perGroup, settings),
          value: parsed.value,
        };
      }).filter((item) => item.value);
    }

    function createQrCanvas(value) {
      const canvas = document.createElement("canvas");
      canvas.width = 96;
      canvas.height = 96;
      canvas.dataset.qrValue = value;
      return canvas;
    }

    function createLabel(item, settings) {
      const card = document.createElement("div");
      card.className = "label-card";

      const left = document.createElement("div");
      left.className = "qr-slot";
      left.appendChild(createQrCanvas(item.value));

      const text = document.createElement("div");
      text.className = "label-text";
      text.textContent = item.label;
      text.title = item.value;

      const right = document.createElement("div");
      right.className = "qr-slot";
      if (settings.mirrorQr) {
        right.appendChild(createQrCanvas(item.value));
      }

      card.append(left, text, right);
      return card;
    }

    function createEmptyLabel() {
      const card = document.createElement("div");
      card.className = "label-card empty";
      return card;
    }

    async function drawQrCodes() {
      if (!window.QRCode || typeof window.QRCode.toCanvas !== "function") {
        throw new Error("Библиотека QR не загрузилась. Проверь интернет и обнови страницу.");
      }

      const canvases = Array.from(document.querySelectorAll("canvas[data-qr-value]"));
      await Promise.all(canvases.map((canvas) => window.QRCode.toCanvas(canvas, canvas.dataset.qrValue, {
        width: 96,
        margin: 0,
        errorCorrectionLevel: "M",
        color: {
          dark: "#000000",
          light: "#ffffff",
        },
      })));
    }

    async function render() {
      const settings = readSettings();
      const items = parseItems(settings);
      const totalCapacity = settings.groupTitles.length * settings.perGroup;

      elements.status.className = "status";
      elements.sheetTitle.textContent = settings.title;
      elements.footerLeftText.textContent = elements.footerLeftInput.value.trim();
      elements.footerRight.textContent = elements.footerRightInput.value.trim();
      elements.footerLeft.classList.toggle("no-mark", !elements.mark.checked);
      elements.groups.style.setProperty("--group-count", settings.groupTitles.length);
      elements.groups.innerHTML = "";

      settings.groupTitles.forEach((groupTitle, groupIndex) => {
        const group = document.createElement("section");
        group.className = "group";

        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = groupTitle;

        const box = document.createElement("div");
        box.className = "group-box";
        box.style.setProperty("--cols-per-group", settings.columns);
        box.style.setProperty("--rows-per-group", settings.rows);

        const start = groupIndex * settings.perGroup;
        const groupItems = items.slice(start, start + settings.perGroup);
        groupItems.forEach((item) => box.appendChild(createLabel(item, settings)));

        if (settings.fillEmpty) {
          for (let i = groupItems.length; i < settings.perGroup; i += 1) {
            box.appendChild(createEmptyLabel());
          }
        }

        group.append(title, box);
        elements.groups.appendChild(group);
      });

      if (!items.length) {
        elements.status.className = "status error";
        elements.status.textContent = "Добавь хотя бы один QR в список.";
        return false;
      }

      if (items.length > totalCapacity) {
        elements.status.className = "status error";
        elements.status.textContent = `Влезает ${totalCapacity}, а в списке ${items.length}. Лишние строки не попали на лист.`;
      } else {
        elements.status.textContent = `Готово: ${items.length} QR на листе, вместимость ${totalCapacity}.`;
      }

      try {
        await drawQrCodes();
        return true;
      } catch (error) {
        elements.status.className = "status error";
        elements.status.textContent = error instanceof Error ? error.message : String(error);
        return false;
      }
    }

    elements.renderBtn.addEventListener("click", render);
    elements.printBtn.addEventListener("click", async () => {
      if (await render()) {
        elements.status.textContent = "Если в окне печати серый бейдж Page 1 of 1 перекрывает низ, не пугайся: это оверлей Safari, он не печатается.";
        window.print();
      }
    });
    elements.sampleBtn.addEventListener("click", () => {
      elements.title.value = "MX раскладки ТМЦ - 2 этаж";
      elements.groupsInput.value = "Ряд 1\nРяд 2";
      elements.columns.value = "2";
      elements.rows.value = "20";
      elements.start.value = "1";
      elements.pad.value = "2";
      elements.resetNumbering.checked = true;
      elements.mirrorQr.checked = true;
      elements.fillEmpty.checked = true;
      elements.items.value = sampleRows;
      render();
    });

    ["input", "change"].forEach((eventName) => {
      [
        elements.title,
        elements.groupsInput,
        elements.columns,
        elements.rows,
        elements.start,
        elements.pad,
        elements.resetNumbering,
        elements.mirrorQr,
        elements.fillEmpty,
        elements.footerLeftInput,
        elements.footerRightInput,
        elements.mark,
      ].forEach((element) => element.addEventListener(eventName, render));
    });

    window.addEventListener("load", render);
  </script>
</body>
</html>
