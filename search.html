<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>WMS+ — Поиск</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="https://raw.githubusercontent.com/mevukolov/WMSplus/refs/heads/main/icons/wms_icon.ico" type="image/x-icon" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="search.js" defer></script>
    <style>
        /* Fully standalone -- no ui.js, no shared header/sidebar, no `pages`
           entry. Its own login (search_login.html) and its own real-session
           guard (top of search.js), independent of the main app's
           login.html/index.html flow. */
        body { background: linear-gradient(180deg, #f7f8fb 0%, #eef0f6 100%); overflow: hidden; }

        .search-logout-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 0;
            background: #fff;
            color: var(--accent-dark, #242038);
            box-shadow: 0 4px 14px rgba(36,32,56,.12);
            font-size: 16px;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .search-logout-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(36,32,56,.18); }

        /* Fixed-height shell: only .search-scroll scrolls, the hero
           (title/input/filter) stays put -- the page itself never scrolls. */
        .search-page {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6vh 20px 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .search-hero {
            flex: none;
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .search-title {
            margin: 0 0 6px;
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 800;
            letter-spacing: -.02em;
            color: var(--accent-dark, #242038);
            opacity: 0;
            animation: searchFadeDown .5s ease-out .05s both;
        }
        .search-input-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border-radius: 999px;
            padding: 6px 6px 6px 22px;
            box-shadow: 0 10px 30px rgba(36,32,56,.10), 0 1px 2px rgba(36,32,56,.06);
            border: 1px solid rgba(15,23,42,.06);
            opacity: 0;
            animation: searchFadeDown .5s ease-out .12s both;
            transition: box-shadow .2s ease, transform .2s ease;
        }
        .search-input-row:focus-within { box-shadow: 0 14px 34px rgba(98,60,234,.18), 0 1px 2px rgba(36,32,56,.06); transform: translateY(-1px); }
        #searchInput {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: none;
            font-size: 16px;
            padding: 12px 4px;
            background: transparent;
            color: #1f2937;
        }
        #searchInput::placeholder { color: #a0a6b4; }
        #searchBtn {
            border: 0;
            border-radius: 999px;
            padding: 12px 26px;
            background: var(--accent, #623CEA);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background .15s ease, transform .1s ease;
            white-space: nowrap;
        }
        #searchBtn:hover { background: var(--accent-dark, #4c2f8f); }
        #searchBtn:active { transform: scale(.97); }
        #searchBtn:disabled { opacity: .6; cursor: default; }

        .search-toolbar {
            display: flex;
            justify-content: center;
            opacity: 0;
            animation: searchFadeDown .5s ease-out .18s both;
        }
        .search-filter-toggle {
            border: 0;
            background: transparent;
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background .15s ease, color .15s ease;
        }
        .search-filter-toggle:hover, .search-filter-toggle.is-open { background: rgba(98,60,234,.08); color: var(--accent, #623CEA); }

        .search-filter-panel {
            width: 100%;
            max-width: 640px;
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows .32s cubic-bezier(.22,1,.36,1), opacity .24s ease, margin-top .32s ease;
        }
        .search-filter-panel.is-open { grid-template-rows: 1fr; opacity: 1; margin-top: 2px; }
        .search-filter-panel-inner { overflow: hidden; min-height: 0; }
        .search-filter-card {
            background: #fff;
            border: 1px solid rgba(15,23,42,.06);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 8px 24px rgba(36,32,56,.06);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-filter-date-row { display: flex; align-items: center; gap: 8px; }
        .search-filter-date-row label { font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
        .search-filter-date-row input[type="date"] {
            border: 1px solid rgba(15,23,42,.12);
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 14px;
            color: #1f2937;
        }
        .search-chip-clear {
            border: 0;
            background: rgba(15,23,42,.06);
            color: #6b7280;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            display: none;
        }
        .search-chip-clear.is-visible { display: inline-flex; align-items: center; justify-content: center; }
        .search-incident-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .search-chip {
            border: 1.5px solid rgba(15,23,42,.12);
            background: #fff;
            color: #374151;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
        }
        .search-chip:hover { border-color: var(--accent, #623CEA); }
        .search-chip.is-active { background: var(--accent, #623CEA); border-color: var(--accent, #623CEA); color: #fff; }
        .search-chip:active { transform: scale(.96); }

        /* Everything below the hero lives in this one scroll container --
           the page/body itself never scrolls (overflow:hidden above). */
        .search-scroll {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 20px 60px;
            box-sizing: border-box;
        }

        .search-status {
            width: 100%;
            max-width: 640px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            min-height: 20px;
        }
        .search-status.is-error { color: #b91c1c; }

        .search-results {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 26px;
            margin-top: 8px;
        }
        .search-results-group { display: flex; flex-direction: column; gap: 10px; }
        .search-results-group-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #9095a3;
            margin: 0 0 2px 4px;
        }
        .search-results-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
        @media (max-width: 1180px) { .search-results-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (max-width: 940px) { .search-results-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 700px) { .search-results-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 460px) { .search-results-grid { grid-template-columns: 1fr; } }

        .search-card {
            background: #fff;
            border: 1px solid rgba(15,23,42,.06);
            border-radius: 14px;
            padding: 13px 15px;
            box-shadow: 0 4px 14px rgba(36,32,56,.05);
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(8px);
            animation: searchCardIn .38s cubic-bezier(.22,1,.36,1) both;
        }
        /* "Вытянуто вертикально" -- taller than wide, not the usual
           landscape thumbnail. */
        .search-card-photo { width: 100%; aspect-ratio: 3 / 4; height: auto; object-fit: cover; border-radius: 10px; background: #eef1f5; cursor: pointer; transition: opacity .15s ease; }
        .search-card-photo:hover { opacity: .85; }
        .search-card-title { font-size: 14px; font-weight: 700; color: #1f2937; }
        .search-card-sub { font-size: 12px; color: #6b7280; }
        .search-card-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #6b7280; }
        .search-card-row strong { color: #374151; font-weight: 600; }
        .search-card-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
        .search-card-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(98,60,234,.1);
            color: var(--accent, #623CEA);
        }
        .search-card-pill.tone-red { background: rgba(239,68,68,.12); color: #b91c1c; }
        .search-card-pill.tone-green { background: rgba(34,197,94,.14); color: #15803d; }
        .search-card-pill.tone-yellow { background: rgba(250,204,21,.2); color: #92700c; }
        .search-empty-state { text-align: center; color: #9095a3; font-size: 14px; padding: 20px 0; }

        /* The exact bit of text that made a result match -- same treatment
           everywhere (item name, task title/snippet, a matched ШК pill). */
        .search-hl { background: #fde047; color: #1f2937; padding: 0 2px; border-radius: 3px; font-weight: 700; }

        /* Small blocks for the tasks group -- just title + what matched. */
        .search-card-task { padding: 10px 12px; gap: 3px; cursor: pointer; transition: border-color .15s ease, transform .15s ease; }
        .search-card-task:hover { border-color: rgba(98,60,234,.35); transform: translateY(-1px); }
        .search-card-task .search-card-title { font-size: 13px; line-height: 1.3; }
        .search-card-task .search-card-sub { font-size: 11.5px; line-height: 1.35; }

        /* ---- read-only task history (opened from a task card) ---- */
        .search-history-modal {
            position: fixed;
            inset: 0;
            z-index: 6000;
            background: rgba(15,12,26,.78);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            animation: searchDetailOverlayIn .18s ease-out both;
        }
        .search-history-modal.active { display: flex; }
        .search-history-card {
            position: relative;
            width: min(640px, 100%);
            max-height: 85vh;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 80px rgba(0,0,0,.4);
            animation: searchDetailCardIn .22s cubic-bezier(.22,1,.36,1) both;
        }
        .search-history-head { padding: 22px 54px 16px 24px; border-bottom: 1px solid rgba(15,23,42,.06); }
        .search-history-title { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: #111827; }
        .search-history-sub { font-size: 13px; color: #6b7280; }
        .search-history-list { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 24px 24px; display: flex; flex-direction: column; gap: 12px; }
        .search-history-row { border-left: 3px solid rgba(98,60,234,.35); padding: 2px 0 2px 14px; }
        .search-history-row-time { font-size: 11px; color: #9095a3; }
        .search-history-row-actor { font-size: 12px; font-weight: 700; color: #374151; margin-top: 2px; }
        .search-history-row-verdict { font-size: 13px; font-weight: 700; color: var(--accent, #623CEA); margin-top: 2px; }
        .search-history-row-comment { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .search-history-empty { text-align: center; color: #9095a3; padding: 30px 0; }
        .search-history-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 0;
            background: rgba(15,23,42,.08);
            color: #374151;
            font-size: 18px;
            cursor: pointer;
        }

        /* Два ШК / Пустая упаковка cards -- co-equal ШК pills (1 or 2) +
           link buttons, no title/sub hierarchy. */
        .search-card-two-shk { padding: 12px 14px; }
        .search-card-shk-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .search-card-pill-shk {
            font-size: 12px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
            background: rgba(15,23,42,.06);
            color: #1f2937;
        }
        .search-card-pill-shk.search-hl { padding: 5px 10px; border-radius: 8px; background: #fde047; color: #1f2937; }
        .search-card-link-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
        .search-card-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            background: var(--accent, #623CEA);
            color: #fff;
            text-decoration: none;
            transition: background .15s ease;
        }
        .search-card-link-btn:hover { background: var(--accent-dark, #4c2f8f); }

        /* ---- full-screen item detail (opened from a "без ШК" photo) ---- */
        .search-detail-modal {
            position: fixed;
            inset: 0;
            z-index: 6000;
            background: rgba(15,12,26,.78);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            animation: searchDetailOverlayIn .18s ease-out both;
        }
        .search-detail-modal.active { display: flex; }
        .search-detail-card {
            position: relative;
            width: min(980px, 100%);
            max-height: 92vh;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 30px 80px rgba(0,0,0,.4);
            animation: searchDetailCardIn .22s cubic-bezier(.22,1,.36,1) both;
        }
        .search-detail-photo-wrap { flex: 1 1 55%; background: #0f172a; display: flex; align-items: center; justify-content: center; min-width: 0; }
        .search-detail-photo-wrap img { width: 100%; height: 100%; max-height: 92vh; object-fit: contain; }
        .search-detail-info { flex: 1 1 45%; min-width: 280px; padding: 26px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .search-detail-close {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 2;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 0;
            background: rgba(15,23,42,.55);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .search-detail-title { font-size: 20px; font-weight: 800; color: #111827; margin: 0 0 6px; }
        .search-detail-row { font-size: 13px; color: #475569; display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(15,23,42,.06); padding-bottom: 8px; }
        .search-detail-row strong { color: #1f2937; font-weight: 700; text-align: right; }
        @media (max-width: 720px) {
            .search-detail-card { flex-direction: column; max-height: 94vh; }
            .search-detail-photo-wrap img { max-height: 36vh; }
        }

        @keyframes searchFadeDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes searchCardIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes searchDetailOverlayIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes searchDetailCardIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            .search-title, .search-input-row, .search-toolbar, .search-card, .search-detail-modal, .search-detail-card { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

<button id="searchLogoutBtn" class="search-logout-btn" type="button" title="Выйти">⎋</button>

<main class="search-page" id="searchPage">
    <div class="search-hero">
        <h1 class="search-title">Поиск</h1>
        <div class="search-input-row">
            <input id="searchInput" type="text" autocomplete="off" placeholder="ШК, номер тары, название, номенклатура…">
            <button id="searchBtn" type="button">Найти</button>
        </div>
        <div class="search-toolbar">
            <button id="filterToggleBtn" type="button" class="search-filter-toggle">Фильтр</button>
        </div>
        <div id="filterPanel" class="search-filter-panel">
            <div class="search-filter-panel-inner">
                <div class="search-filter-card">
                    <div class="search-filter-date-row">
                        <label for="filterDate">Дата</label>
                        <input id="filterDate" type="date">
                        <button id="filterDateClear" type="button" class="search-chip-clear" aria-label="Сбросить дату">×</button>
                    </div>
                    <div class="search-incident-chips" id="incidentChips">
                        <button type="button" class="search-chip" data-incident="Без ШК">Товар «Без ШК»</button>
                        <button type="button" class="search-chip" data-incident="Два ШК">Два ШК</button>
                        <button type="button" class="search-chip" data-incident="Пустая упаковка">Пустая упаковка</button>
                        <button type="button" class="search-chip" data-incident="Разбор ОПП">Разбор ОПП</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="search-scroll" id="searchScroll">
        <div id="searchStatus" class="search-status"></div>
        <div id="searchResults" class="search-results"></div>
    </div>
</main>

<section id="searchDetailModal" class="search-detail-modal" aria-hidden="true">
    <div class="search-detail-card">
        <button id="closeSearchDetail" class="search-detail-close" type="button" aria-label="Закрыть">×</button>
        <div class="search-detail-photo-wrap"><img id="searchDetailPhoto" alt=""></div>
        <div id="searchDetailInfo" class="search-detail-info"></div>
    </div>
</section>

<section id="searchHistoryModal" class="search-history-modal" aria-hidden="true">
    <div class="search-history-card">
        <button id="closeSearchHistory" class="search-history-close" type="button" aria-label="Закрыть">×</button>
        <div class="search-history-head">
            <h2 id="searchHistoryTitle" class="search-history-title">Задача</h2>
            <p id="searchHistorySub" class="search-history-sub"></p>
            <div id="searchHistoryTwoShk" class="search-card-shk-row" style="margin-top:8px;"></div>
        </div>
        <div id="searchHistoryList" class="search-history-list"></div>
    </div>
</section>

</body>
</html>
