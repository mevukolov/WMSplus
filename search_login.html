<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>WMS+ — Вход в Поиск</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="https://raw.githubusercontent.com/mevukolov/WMSplus/refs/heads/main/icons/wms_icon.ico" type="image/x-icon" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="search_login.js" defer></script>
    <style>
        /* Dedicated login for search.html -- deliberately its own small
           page, not login.html: signing in here goes straight back to
           search.html, never into the main app's index.html/tasks.html. */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f7f8fb 0%, #eef0f6 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            padding: 20px;
        }
        .search-login-card {
            width: min(340px, 100%);
            background: #fff;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(36,32,56,.12), 0 1px 2px rgba(36,32,56,.06);
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: searchLoginIn .4s cubic-bezier(.22,1,.36,1) both;
        }
        .search-login-title {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -.02em;
            color: #242038;
            text-align: center;
        }
        .search-login-subtitle {
            margin: -8px 0 4px;
            text-align: center;
            font-size: 13px;
            color: #9095a3;
        }
        .search-login-field input {
            width: 100%;
            border: 1.5px solid rgba(15,23,42,.1);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
            transition: border-color .15s ease;
        }
        .search-login-field input:focus { border-color: #623CEA; }
        .search-login-submit {
            border: 0;
            border-radius: 12px;
            padding: 12px;
            background: #623CEA;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background .15s ease, transform .1s ease;
        }
        .search-login-submit:hover { background: #4c2f8f; }
        .search-login-submit:active { transform: scale(.98); }
        .search-login-submit:disabled { opacity: .6; cursor: default; }
        .search-login-error {
            margin: 0;
            min-height: 16px;
            text-align: center;
            font-size: 13px;
            color: #b91c1c;
        }
        @keyframes searchLoginIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <main class="search-login-card">
        <h1 class="search-login-title">Поиск</h1>
        <p class="search-login-subtitle">Вход по учётной записи WMS+</p>
        <label class="search-login-field"><input id="loginId" type="text" placeholder="ID" autocomplete="username" inputmode="numeric" autofocus></label>
        <label class="search-login-field"><input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password"></label>
        <button id="loginBtn" class="search-login-submit" type="button">Войти</button>
        <p id="loginError" class="search-login-error"></p>
    </main>
</body>
</html>
