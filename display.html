<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMS+ — Витрина «Без ШК»</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="https://raw.githubusercontent.com/mevukolov/WMSplus/refs/heads/main/icons/wms_icon.ico" type="image/x-icon">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
    /* ---------- Page shell: unattended kiosk, nothing to scroll with, so
       nothing on this page ever scrolls -- everything divides the
       viewport's actual height/width via flex, instead of a fixed CSS
       "no_shk_zone.js" pixel layout that would just overflow off-screen. ---------- */
    html, body { height: 100%; overflow: hidden; margin: 0; }
    body {
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #ffffff 0%, #f4f0ff 58%, #ebe5ff 100%);
        transition: background .8s ease;
    }
    .display-header {
        flex: none;
        padding: 16px 28px 4px;
        transition: opacity .8s ease;
    }
    .display-header h1 {
        margin: 0;
        color: var(--accent-dark);
        font-size: clamp(18px, 2.2vw, 26px);
        letter-spacing: -.03em;
    }
    .display-zone {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        padding: 4px 28px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: opacity .8s ease;
    }
    /* Night mode (20:30-07:30, toggled by display.js): nobody's on the
       floor overnight, but the monitor stays on -- so instead of turning
       it off, the page itself goes to a plain black screen. The QR
       overlay (z-index 100) still shows over it if a broadcast happens to
       land during this window -- night mode only hides the zone view. */
    body.is-night { background: #000; }
    body.is-night .display-header,
    body.is-night .display-zone {
        opacity: 0;
        pointer-events: none;
    }

    /* ---------- Below: same "Без ШК" zone classes/markup as
       tasks.html/no_shk_zone.js's renderZoneView(), same data -- but laid
       out to fill a fixed viewport instead of growing/wrapping/scrolling:
       racks are always one row (equal-width columns), shelves within a
       rack always share the rack's height equally regardless of how many
       boxes are on each one, and "Вне ОПП"/"На полу" sit side by side in
       a single row instead of stacked. This file never edits
       no_shk_zone.js -- it's a separate read-only renderer. ---------- */

    /* Вне ОПП (fixed-width, sized to exactly 3 tiles by its own content)
       and На полу (flex:1, takes whatever width is left) in one row. */
    .no-shk-top-row {
        display: flex;
        gap: 16px;
        align-items: stretch;
        flex: none;
    }
    .no-shk-floor {
        border: 2px dashed #cbd5e1;
        border-radius: 8px;
        padding: 8px 14px;
    }
    .no-shk-floor-outside { flex: 0 0 auto; }
    .no-shk-floor-onfloor { flex: 1 1 auto; min-width: 0; }
    .no-shk-floor-title {
        font-weight: 700;
        font-size: 12px;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: .04em;
        margin: 0 0 8px;
    }
    .no-shk-boxes-row {
        display: flex;
        flex-wrap: nowrap;
        overflow: hidden;
        gap: 8px;
    }

    /* Racks: always exactly one row, every rack an equal share of the
       width. Unlike the top row, a rack's HEIGHT is sized to its own
       content (align-items:flex-start on the row) -- shelves are not
       stretched to fill whatever vertical space happens to be left over.
       Box tiles inside a shelf are square (--tile, computed once per
       render in display.js from the actual column width so a rack with
       more/fewer racks alongside it still gets tiles sized to fit), and
       every shelf reserves exactly one tile's worth of height via
       min-height regardless of whether it holds any boxes -- that's what
       makes a shelf "the ideal size to fit them" instead of growing only
       when a box is placed there. */
    .no-shk-racks-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 14px;
    }
    .no-shk-rack {
        flex: 1 1 0;
        min-width: 0;
    }
    .no-shk-rack-title {
        font-weight: 700;
        font-size: 13px;
        color: #4c1d95;
        margin: 0 0 6px;
        letter-spacing: .01em;
    }
    .no-shk-rack-frame {
        width: 100%;
        background: #faf9fd;
        border: 3px solid #7c5cf0;
        border-radius: 10px;
        overflow: hidden;
    }
    .no-shk-shelf {
        border-bottom: 2px solid #ded6f7;
        padding: 6px 10px 8px;
    }
    .no-shk-rack-frame .no-shk-shelf:last-child { border-bottom: none; }
    .no-shk-shelf-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
        font-size: 11px;
        color: #64748b;
        font-weight: 600;
    }
    .no-shk-shelf-fill.is-full { color: #b91c1c; font-weight: 700; }
    .no-shk-shelf .no-shk-boxes-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        min-height: var(--tile, 48px);
        align-items: center;
    }

    @keyframes no-shk-box-in {
        from { opacity: 0; transform: scale(.85) translateY(4px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes no-shk-box-pop {
        0% { opacity: 0; transform: scale(.35) rotate(-10deg); }
        55% { opacity: 1; transform: scale(1.14) rotate(4deg); }
        80% { transform: scale(.96) rotate(-1deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .no-shk-box {
        position: relative;
        flex: none;
        box-sizing: border-box;
        width: 64px;
        height: 60px;
        background: #eceef3;
        border: 1.5px solid #c7ccd9;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        overflow: hidden;
        transition: background .12s ease, transform .12s ease, border-color .12s ease;
        animation: no-shk-box-in .3s ease-out both;
    }
    /* Inside a shelf, a box is a square of side --tile (computed per
       render in display.js from the rack's actual column width) instead
       of the fixed 64x60 rectangle used in the Вне ОПП/На полу row. */
    .no-shk-shelf .no-shk-box { width: var(--tile, 48px); height: var(--tile, 48px); flex: none; }
    .no-shk-box-number { position: relative; z-index: 1; font-size: 12px; font-weight: 700; color: #334155; }
    .no-shk-box-date {
        position: relative;
        z-index: 1;
        font-size: 9px;
        font-weight: 600;
        border-radius: 4px;
        padding: 1px 5px;
        transition: background .12s ease, color .12s ease;
    }
    .no-shk-box.area-sort .no-shk-box-date { background: rgba(250,204,21,.32); color: #7c5e07; }
    .no-shk-box.area-repack .no-shk-box-date { background: rgba(167,139,250,.32); color: #4c2f8f; }
    .no-shk-box::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 8px;
        margin-left: -4px;
    }
    .no-shk-box.area-sort::before { background: #facc15; }
    .no-shk-box.area-repack::before { background: #a78bfa; }
    .no-shk-box.is-new { animation: no-shk-box-pop .55s cubic-bezier(.34,1.56,.64,1) both; }

    /* "+N" summary tile standing in for boxes that didn't fit their row's
       slot budget (3 for Вне ОПП, however many fit for На полу). */
    .no-shk-box-more {
        background: #ede9fe;
        border: 1.5px dashed #a78bfa;
    }
    .no-shk-box-more::before { content: none; }
    .no-shk-box-more-count { font-size: 15px; font-weight: 800; color: #5b21b6; }

    /* ---------- QR overlay: shown on a "show_qr" broadcast from the mobile
       form's "Закрыть короб" button. Hidden by default (opacity+pointer-
       events, no display:none so the pop animation can replay cleanly). ---------- */
    .qr-overlay {
        position: fixed;
        inset: 0;
        background: rgba(36,32,56,.82);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s ease;
        z-index: 100;
    }
    .qr-overlay.is-visible { opacity: 1; pointer-events: auto; }
    @keyframes qr-card-in {
        0% { opacity: 0; transform: scale(.7) translateY(24px); }
        60% { opacity: 1; transform: scale(1.06) translateY(-6px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .qr-card {
        background: #fff;
        border-radius: var(--radius-lg);
        padding: 44px 56px;
        text-align: center;
        box-shadow: var(--shadow-md);
    }
    .qr-overlay.is-visible .qr-card {
        animation: qr-card-in .55s cubic-bezier(.34,1.56,.64,1) both;
    }
    .qr-card-title {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 800;
        color: var(--accent-dark);
        letter-spacing: -.02em;
    }
    .qr-card-context {
        margin: 0 0 28px;
        font-size: 17px;
        font-weight: 600;
        color: var(--accent);
    }
    .qr-code-box {
        display: flex;
        justify-content: center;
        margin-bottom: 22px;
    }
    .qr-code-box img, .qr-code-box canvas { border-radius: var(--radius-sm); }
    .qr-card-hint {
        margin: 0;
        font-size: 14px;
        color: #94a3b8;
    }

    /* ---------- Inventory-mode rack coloring: applied to the existing
       .no-shk-rack elements (rendered by renderZoneView(), never replaced
       by inventory mode) while a wms_no_shk_inventory_sessions row is
       active. ---------- */
    .no-shk-rack.is-audited .no-shk-rack-title { color: #15803d; }
    .no-shk-rack.is-audited .no-shk-rack-frame { border-color: #22c55e; }
    .no-shk-rack.is-pending .no-shk-rack-title { color: #b91c1c; }
    .no-shk-rack.is-pending .no-shk-rack-frame { border-color: #ef4444; }
</style>
</head>
<body>

<header class="display-header">
    <h1>Зона «Без ШК»</h1>
</header>
<div id="displayZoneWrap" class="display-zone"></div>

<div id="qrOverlay" class="qr-overlay" aria-hidden="true">
    <div class="qr-card">
        <p class="qr-card-title">Закрытие короба</p>
        <p class="qr-card-context" id="qrOverlayContext"></p>
        <div id="qrOverlayCode" class="qr-code-box"></div>
        <p class="qr-card-hint">Отсканируйте телефоном</p>
    </div>
</div>

<div id="inventoryOverlay" class="qr-overlay" aria-hidden="true">
    <div class="qr-card" id="inventoryCard">
        <p class="qr-card-title" id="inventoryStepText">Инвентаризация «Без ШК»</p>
        <div id="inventoryQrBox" class="qr-code-box"></div>
        <div id="inventoryArrow" style="display:none;font-size:64px;color:var(--accent);margin:8px 0;">→</div>
    </div>
</div>

<script src="display.js"></script>
</body>
</html>
