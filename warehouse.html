<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Склад</title>
<style>
  :root {
    --ground: #d9c9a3;
    --ground-line: #c2ae7c;
    --plot: #8b6f4e;
    --plot-top: #a9855c;
    --bg: #eef2f7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    color: #1f2937;
    margin: 0 0 16px;
  }
  .hud {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 999px;
    padding: 8px 18px;
    box-shadow: 0 4px 14px rgba(31, 41, 55, .12);
    font-weight: 700;
    color: #1f2937;
    font-size: 15px;
  }
  .iso-stage {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 0;
  }
  .iso-grid {
    display: grid;
    grid-template-columns: repeat(5, 48px);
    grid-template-rows: repeat(5, 48px);
    gap: 3px;
    transform: rotateX(55deg) rotateZ(45deg);
    transform-style: preserve-3d;
  }
  .iso-tile {
    background: var(--ground);
    border: 1px solid var(--ground-line);
    border-radius: 4px;
    cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  .iso-tile:hover {
    filter: brightness(1.06);
  }
  .iso-tile.plot {
    background: var(--plot-top);
    border: 2px solid var(--plot);
    border-radius: 4px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
    cursor: default;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 0);
    background: #1f2937;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -6px);
  }
</style>
</head>
<body>
  <h1>Склад</h1>
  <div class="hud">💎 Пики: <span id="pikesValue">0</span></div>
  <div class="iso-stage">
    <div class="iso-grid" id="isoGrid"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var raw = localStorage.getItem("user");
      var user = null;
      try { user = raw ? JSON.parse(raw) : null; } catch (e) { user = null; }
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      var GRID_SIZE = 5;
      var STATE_KEY = "warehouse_state_v1";
      var START_PIKES = 100;
      var BUILD_COST = 50;

      function tileKey(row, col) {
        return row + "_" + col;
      }

      function loadState() {
        var raw = localStorage.getItem(STATE_KEY);
        if (raw) {
          try {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.pikes === "number" && Array.isArray(parsed.builtTiles)) {
              return parsed;
            }
          } catch (e) { /* fall through to default state */ }
        }
        return { pikes: START_PIKES, builtTiles: [{ row: 2, col: 2 }] };
      }

      function saveState(state) {
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
      }

      var state = loadState();

      function buildGridTiles(builtTiles) {
        var built = new Set(builtTiles.map(function (t) { return tileKey(t.row, t.col); }));
        var tiles = [];
        for (var row = 0; row < GRID_SIZE; row++) {
          for (var col = 0; col < GRID_SIZE; col++) {
            tiles.push({
              row: row,
              col: col,
              type: built.has(tileKey(row, col)) ? "plot" : "ground",
            });
          }
        }
        return tiles;
      }

      var toastTimer = null;
      function showToast(message) {
        var el = document.getElementById("toast");
        el.textContent = message;
        el.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2000);
      }

      function updatePikesDisplay() {
        document.getElementById("pikesValue").textContent = String(state.pikes);
      }

      function handleTileClick(row, col) {
        var already = state.builtTiles.some(function (t) { return t.row === row && t.col === col; });
        if (already) return;
        if (state.pikes < BUILD_COST) {
          showToast("Недостаточно пиков");
          return;
        }
        state.pikes -= BUILD_COST;
        state.builtTiles.push({ row: row, col: col });
        saveState(state);
        updatePikesDisplay();
        renderGrid(buildGridTiles(state.builtTiles));
      }

      function renderGrid(tiles) {
        var container = document.getElementById("isoGrid");
        container.innerHTML = "";
        tiles.forEach(function (tile) {
          var el = document.createElement("div");
          el.className = "iso-tile" + (tile.type === "plot" ? " plot" : "");
          el.style.gridRow = String(tile.row + 1);
          el.style.gridColumn = String(tile.col + 1);
          if (tile.type === "ground") {
            el.addEventListener("click", function () { handleTileClick(tile.row, tile.col); });
          }
          container.appendChild(el);
        });
      }

      updatePikesDisplay();
      renderGrid(buildGridTiles(state.builtTiles));
    })();
  </script>
</body>
</html>
